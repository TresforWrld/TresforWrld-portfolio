<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tresfor Zulu — Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Bebas+Neue&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; min-height: 100vh;
      background: #3a3a3a;
      font-family: 'DM Sans', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Wrapper that holds the image + all overlays */
    .frame {
      position: relative;
      width: 100%;
      max-width: 900px;
      /* image is ~900x660 original ratio */
    }

    .frame img.bg {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* All overlays sit absolutely inside .frame, 
       using % so they scale with the image */

    /* ── #25 → #1 ── 
       In the image the badge is roughly at:
       right ~8%, top ~27% of the image height */
    .overlay-num {
      position: absolute;
      top: 27%;
      right: 7.5%;
      background: #E8470A;
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(18px, 3.6vw, 36px);
      line-height: 1;
      padding: 0.18em 0.55em 0.1em;
      letter-spacing: 1px;
      pointer-events: none;
    }

    /* ── NHANDIGIER → TRESFOR ZULU ──
       Bottom right of canvas, roughly right 18%, bottom 15% */
    .overlay-name {
      position: absolute;
      bottom: 14.5%;
      right: 17%;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(10px, 1.6vw, 16px);
      letter-spacing: 3px;
      color: #1a1a1a;
      line-height: 1;
      pointer-events: none;
    }
    .overlay-name .ac { color: #E8470A; }

    /* ── Tagline replacing the "COOLVETICA / MTD HOUSTONER SCRIPT" text ──
       Bottom left area, roughly left 12%, bottom 17% */
    .overlay-tagline {
      position: absolute;
      bottom: 16%;
      left: 11%;
      display: flex;
      flex-direction: column;
      gap: 1px;
      pointer-events: none;
    }
    .tl-top {
      font-size: clamp(6px, 1vw, 10px);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #888;
      line-height: 1.6;
    }
    .tl-main {
      font-size: clamp(7px, 1.1vw, 11px);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #E8470A;
    }

    /* ── FOOTER ── */
    .footer {
      width: 100%;
      max-width: 900px;
      text-align: center;
      padding: 14px 0 18px;
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.8px;
    }
  </style>
</head>
<body>

  <div class="frame">
    <!-- EXACT original image -->
    <img class="bg" src="portfolio-bg.jpg" alt="Portfolio Template"/>

    <!-- Replace #25 with #1 -->
    <div class="overlay-num">#1</div>

    <!-- Replace NHANDIGIER with TRESFOR ZULU -->
    <div class="overlay-name">TRESFOR<span class="ac">ZULU</span></div>

    <!-- Replace font credit text with tagline -->
    <div class="overlay-tagline">
      <span class="tl-top">Bebas Neue &nbsp;·&nbsp; Sacramento Script</span>
      <span class="tl-main">The Best Local Services</span>
    </div>
  </div>

  <footer class="footer">&copy;2026 ANICADE Tech. All Rights Reserved.</footer>

</body>
</html>
