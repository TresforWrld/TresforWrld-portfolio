<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tresfor Zulu — Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #E8470A;
      --black:  #1a1a1a;
      --light:  #f0efed;
    }

    html, body {
      width: 100%; min-height: 100vh;
      background: var(--light);
      font-family: 'DM Sans', sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* ── SLIM TOP NAV ── */
    .topnav {
      width: 100%;
      background: #3a3a3a;
      display: flex;
      align-items: center;
      padding: 0 16px;
      height: 34px;
      gap: 2px;
      flex-shrink: 0;
    }
    .nav-home {
      width: 26px; height: 26px;
      background: var(--orange);
      display: flex; align-items: center; justify-content: center;
      border-radius: 4px;
      font-size: 13px;
      margin-right: 8px;
      flex-shrink: 0;
    }
    .nav-file {
      background: var(--orange);
      color: white;
      font-size: 12px;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 3px;
      cursor: pointer;
    }
    .nav-item {
      color: rgba(255,255,255,0.72);
      font-size: 12px;
      padding: 2px 9px;
      cursor: pointer;
      border-radius: 3px;
      transition: background 0.15s;
    }
    .nav-item:hover { background: rgba(255,255,255,0.1); color: white; }
    .nav-spacer { flex: 1; }
    .nav-right { display: flex; align-items: center; gap: 6px; }
    .nav-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
      width: 18px; height: 18px;
    }
    .ng-sq { background: rgba(255,255,255,0.45); border-radius: 1px; }
    .ng-sq.o { background: var(--orange); }
    .wbtns { display: flex; gap: 4px; margin-left: 8px; }
    .wb { width: 11px; height: 11px; border-radius: 2px; background: rgba(255,255,255,0.22); cursor: pointer; }
    .wb.cl { background: var(--orange); }

    /* ── STAGE ── */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 28px 20px;
    }

    /* ── CENTRE CARD ── */
    .card {
      background: #f7f6f4;
      width: 100%;
      max-width: 840px;
      border: 1px solid #d4d4d4;
      box-shadow: 0 6px 40px rgba(0,0,0,0.12);
      position: relative;
      padding: 44px 52px 38px;
      overflow: hidden;
    }

    /* TOP ROW */
    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 4px;
      position: relative;
      z-index: 2;
    }
    .badges { display: flex; gap: 7px; }
    .badge {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 4px;
      letter-spacing: 0.2px;
    }
    .badge.ai { background: #001d34; color: #31a8ff; }
    .badge.ps { background: #310000; color: #ff9a00; }
    .num-badge {
      background: var(--orange);
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 30px;
      line-height: 1;
      padding: 5px 14px 3px;
      letter-spacing: 1px;
    }

    /* Pen cursor */
    .pen {
      position: absolute;
      top: 50px;
      left: 44%;
      font-size: 26px;
      transform: rotate(12deg);
      pointer-events: none;
      z-index: 10;
      color: var(--black);
      animation: pb 2.8s ease-in-out infinite;
    }
    @keyframes pb {
      0%,100% { transform: rotate(12deg) translateY(0); }
      50%      { transform: rotate(12deg) translateY(-7px); }
    }

    /* ── TITLE ── */
    .title-wrap {
      position: relative;
      margin-bottom: 30px;
      line-height: 1;
      user-select: none;
    }

    .main-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(82px, 14vw, 148px);
      color: var(--black);
      letter-spacing: -1px;
      line-height: 0.92;
      position: relative;
      z-index: 2;
      opacity: 0;
      animation: tIn 0.6s 0.1s cubic-bezier(.22,1,.36,1) forwards;
    }
    @keyframes tIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* dot + dash replacing the "o" */
    .dot-dash {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      vertical-align: middle;
      position: relative;
      top: -5px;
    }
    .d-circle {
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--orange);
      flex-shrink: 0;
    }
    .d-dash {
      width: 34px; height: 10px;
      background: var(--orange);
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* dashed selection box */
    .sel {
      display: inline-block;
      position: relative;
    }
    .sel::before {
      content: '';
      position: absolute;
      inset: -4px -2px;
      border: 1.5px dashed rgba(50,110,210,0.65);
      border-radius: 2px;
      pointer-events: none;
    }
    /* right-side anchor */
    .sel::after {
      content: '';
      position: absolute;
      right: -7px; top: 50%;
      transform: translateY(-50%);
      width: 7px; height: 7px;
      background: white;
      border: 1.5px solid rgba(50,110,210,0.7);
      border-radius: 1px;
    }

    /* Script orange F */
    .script-f {
      position: absolute;
      font-family: 'Sacramento', cursive;
      font-size: clamp(110px, 18vw, 200px);
      color: var(--orange);
      top: -28px;
      left: 36%;
      transform: rotate(-4deg);
      z-index: 3;
      pointer-events: none;
      line-height: 1;
      opacity: 0;
      animation: sIn 0.9s 0.35s cubic-bezier(.22,1,.36,1) forwards;
    }
    @keyframes sIn {
      from { opacity: 0; transform: rotate(-4deg) translateY(28px) scale(0.88); }
      to   { opacity: 1; transform: rotate(-4deg) translateY(0) scale(1); }
    }

    /* ── BOTTOM ROW ── */
    .card-bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 18px;
      position: relative;
      z-index: 2;
      opacity: 0;
      animation: fUp 0.7s 0.65s forwards;
    }
    @keyframes fUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Font info + swatches */
    .font-block {}
    .fn {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #b0b0b0;
      display: block;
      line-height: 1.8;
    }
    .swatches {
      display: flex;
      gap: 4px;
      margin-top: 8px;
    }
    .sw {
      width: 22px; height: 22px;
      border-radius: 2px;
    }
    .arrow {
      font-size: 20px;
      color: var(--orange);
      display: block;
      margin-top: 9px;
    }

    /* GD box */
    .gd-box {
      border: 2px solid var(--black);
      padding: 8px 14px;
      text-align: center;
      line-height: 1.1;
    }
    .gd-top {
      font-family: 'Sacramento', cursive;
      font-size: 28px;
      color: var(--black);
      line-height: 1;
    }
    .gd-bot {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--orange);
    }

    /* Name */
    .name-block {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 17px;
      letter-spacing: 3px;
      color: var(--black);
      line-height: 1;
    }
    .name-block .ac { color: var(--orange); }

    /* ── FOOTER ── */
    .footer {
      width: 100%;
      text-align: center;
      padding: 16px 0 20px;
      font-size: 11px;
      color: #aaa;
      letter-spacing: 0.8px;
      flex-shrink: 0;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .card { padding: 28px 22px 24px; }
      .main-title { font-size: 64px; }
      .script-f { font-size: 90px; top: -18px; left: 32%; }
      .nav-item { display: none; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav class="topnav">
    <div class="nav-home">🏠</div>
    <span class="nav-file">File</span>
    <span class="nav-item">Edit</span>
    <span class="nav-item">Object</span>
    <span class="nav-item">Type</span>
    <span class="nav-item">Select</span>
    <span class="nav-item">Effect</span>
    <span class="nav-item">View</span>
    <span class="nav-item">Window</span>
    <span class="nav-item">Help</span>
    <div class="nav-spacer"></div>
    <div class="nav-right">
      <div class="nav-grid">
        <div class="ng-sq o"></div>
        <div class="ng-sq"></div>
        <div class="ng-sq"></div>
        <div class="ng-sq"></div>
      </div>
      <div class="wbtns">
        <div class="wb"></div>
        <div class="wb"></div>
        <div class="wb cl"></div>
      </div>
    </div>
  </nav>

  <!-- STAGE -->
  <div class="stage">
    <div class="card">

      <!-- TOP -->
      <div class="card-top">
        <div class="badges">
          <span class="badge ai">Ai</span>
          <span class="badge ps">Ps</span>
        </div>
        <div class="num-badge">#25</div>
      </div>

      <!-- Pen -->
      <div class="pen">✒</div>

      <!-- TITLE -->
      <div class="title-wrap">
        <div class="script-f">f</div>
        <div class="main-title">
          p<span class="dot-dash"><span class="d-circle"></span><span class="d-dash"></span></span>rt<span class="sel">folio</span>
        </div>
      </div>

      <!-- BOTTOM -->
      <div class="card-bottom">
        <div class="font-block">
          <span class="fn">Bebas Neue</span>
          <span class="fn">Sacramento Script</span>
          <div class="swatches">
            <div class="sw" style="background:#1a1a1a"></div>
            <div class="sw" style="background:#E8470A"></div>
            <div class="sw" style="background:#f0efed;border:1px solid #ccc"></div>
            <div class="sw" style="background:#3a3a3a"></div>
          </div>
          <span class="arrow">➤</span>
        </div>

        <div class="gd-box">
          <div class="gd-top">Graphics</div>
          <div class="gd-bot">Designer ✒</div>
        </div>

        <div class="name-block">TRESFOR<span class="ac">ZULU</span></div>
      </div>

    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">&copy;2026 ANICADE Tech. All Rights Reserved.</footer>

</body>
</html>
